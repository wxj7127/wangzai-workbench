# Render Blueprint - 旺仔学习工作台
# https://render.com/docs/blueprint-spec
services:
  # Web Service - Node.js 后端 + 静态文件
  - type: web
    name: wangzai-workbench
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: workbench-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: NODE_ENV
        value: production

  # PostgreSQL 数据库
databases:
  - name: workbench-db
    plan: free
    ipAllowList: []
